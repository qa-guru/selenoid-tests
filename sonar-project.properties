# SonarQube — qa-guru/selenoid-tests (orchestrator only)
# Canon: docs/sonar/SONAR-CANON.md · docs/sonar/GITHUB-ACTIONS.md
sonar.projectKey=selenoid-tests
sonar.projectName=selenoid-tests
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/repos/**,**/build/**,**/allure-results/**,**/allure/**,**/node_modules/**,**/video/**,**/bin/**,**/fixtures/**,**/docs/**,**/.github/**,**/notifications/**
# Go coverage report does not include node/python CLIs; keep them out of new_coverage.
sonar.coverage.exclusions=**/*.mjs,**/*.py,**/*.html,**/pages-templates/**
sonar.sourceEncoding=UTF-8
sonar.go.coverage.reportPaths=coverage.txt
