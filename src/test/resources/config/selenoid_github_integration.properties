# selenoid_github — integration layer
# SELENOID_TEST_ENV=selenoid_github_integration ./scripts/run-go-pyramid.sh integration

hubUrl=http://127.0.0.1:4444/
uiUrl=http://127.0.0.1:8080/
apiBaseUrl=
smokeUrl=https://example.com/

browser=chrome
browserVersion=149.0-min
browserSize=1920x1280
headless=true

remoteUrl=http://127.0.0.1:4444/wd/hub

# Playwright session (ws://127.0.0.1:4444/playwright/playwright-chromium/1.61.1)
playwrightWsEndpoint=ws://127.0.0.1:4444/playwright/playwright-chromium/1.61.1
playwrightSessionName=java-playwright-integration
playwrightSessionTimeout=5m
playwrightEnableVnc=false
playwrightEnableVideo=false

logToConsole=false
selenideLogToConsole=false
rootLogLevel=info
