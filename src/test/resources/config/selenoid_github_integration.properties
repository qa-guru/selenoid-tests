# selenoid_github — integration layer
# SELENOID_TEST_ENV=selenoid_github_integration ./scripts/run-go-pyramid.sh integration

hubUrl=http://127.0.0.1:4444/
uiUrl=http://127.0.0.1:8080/
apiBaseUrl=
