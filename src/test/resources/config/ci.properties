# DEPRECATED: use selenoid_github_e2e.properties (SELENOID_TEST_ENV=selenoid_github_e2e).
# CI profile: Selenoid hub smoke (GitHub Actions)
hubUrl=http://127.0.0.1:4444/
uiUrl=http://127.0.0.1:8080/
remoteUrl=http://127.0.0.1:4444/wd/hub
smokeUrl=https://autotests.ai/stack/backend-java-spring/frontend-typescript-react/login

# Playwright session
playwrightWsEndpoint=ws://127.0.0.1:4444/playwright/playwright-chromium/1.62.1
playwrightSessionName=java-playwright-tests
playwrightSessionTimeout=5m
playwrightEnableVnc=false
playwrightEnableVideo=false

# Allow attachments after each test
attachLastScreenshot=false

# Browser configuration
browser=chrome
browserVersion=152.0
browserSize=1920x1080
headless=true
closeBrowserAfterEach=true

# Remote browser hub configuration
enableVnc=false
enableVideo=false

# Console log
logToConsole=false
selenideLogToConsole=false
