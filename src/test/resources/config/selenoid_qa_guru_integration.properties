# selenoid_qa_guru — integration (@Layer(integration) @Tag(integration) — prod remote hub)
# ./gradlew testIntegration -DpyramidStand=selenoid_qa_guru -DskipHealthCheck=true
# uiUrl may embed basic auth for legacy callers; Selenide baseUrl strips userinfo
# (fetch() rejects credentialed document URLs). New Session fills authUser/authPass
# from remoteUrl via ConfigReader.resolveHubBasicAuth().

attachBrowserConsoleLogs=false
attachLastScreenshot=false
attachPageSource=false

hubUrl=https://selenoid.qa.guru/
uiUrl=https://user1:1234@selenoid.qa.guru/
apiBaseUrl=https://user1:1234@selenoid.qa.guru/
hubStatusPath=/hub/status
smokeUrl=https://example.com/

playwrightWsEndpoint=wss://selenoid.qa.guru/playwright/playwright-chromium/1.61.1?accessKey=user1:1234&name=java-playwright-integration&sessionTimeout=5m&enableVNC=false&enableVideo=false
playwrightSessionName=java-playwright-integration
playwrightSessionTimeout=5m
playwrightEnableVnc=false
playwrightEnableVideo=false

browser=chrome
browserVersion=149.0
browserSize=1920x1280
headless=true
closeBrowserAfterEach=false

enableVnc=false
enableVideo=false
remoteUrl=https://user1:1234@selenoid.qa.guru/wd/hub

logToConsole=false
selenideLogToConsole=false
rootLogLevel=info
