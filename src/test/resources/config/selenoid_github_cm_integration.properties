# selenoid_github — CM installer (:4445/:8081)
# SELENOID_TEST_ENV=selenoid_github_cm_integration ./scripts/run-go-pyramid.sh cm
# Prerequisite: scripts/prepare-ci-cm-workspace.sh (+ start-ci-cm-stack.sh for api slice)

hubUrl=http://127.0.0.1:4445/
uiUrl=http://127.0.0.1:8081/
apiBaseUrl=
remoteUrl=http://127.0.0.1:4445/wd/hub
cmHubPort=4445
cmUiPort=8081
smokeUrl=https://autotests.ai/stack/backend-java-spring/frontend-typescript-react/login

browser=chrome
browserVersion=152.0-min
browserSize=1920x1280
headless=true
closeBrowserAfterEach=true

enableVnc=false
enableVideo=false

cmBinaryPath=build/ci-bin/cm
cmSelenoidBinary=build/ci-bin/selenoid
cmSelenoidUiBinary=build/ci-bin/selenoid-ui
cmBrowsersJson=fixtures/ci-browsers.json
cmUseLocalBinaries=true

logToConsole=false
selenideLogToConsole=false
rootLogLevel=info
