# Runtime defaults — lowest-priority keys; env profiles override via config/${env}.properties.
# SSOT structure: _ethalon.properties. Env profiles override via config/${env}.properties.

# Allure report
allureReportMode=allure3

# Allow attachments after each test
attachBrowserConsoleLogs=false
attachLastScreenshot=false
attachPageSource=false
attachHarLogs=false

# REST API (@Layer api — Rest Assured; empty → hubUrl)
apiBaseUrl=

# Selenoid hub (hub smoke, selenoid-home; local: dev/scripts/start-selenoid.sh)
hubUrl=http://127.0.0.1:4444/
uiUrl=http://127.0.0.1:8080/
smokeUrl=https://autotests.ai/stack/backend-java-spring/frontend-typescript-react/login

# Playwright session (Java + Playwright via Selenoid hub)
playwrightWsEndpoint=ws://127.0.0.1:4444/playwright/playwright-chromium/1.62.1
playwrightSessionName=java-playwright-tests
playwrightSessionTimeout=5m
playwrightEnableVnc=false
playwrightEnableVideo=false

# Browser configuration (override: -DbrowserVersion=… -DchromeMinVersion=…)
browser=chrome
browserVersion=152.0
chromeVersion=152.0
chromeMinVersion=152.0-min
firefoxVersion=154.0
firefoxMinVersion=154.0-min
msedgeVersion=151.0
msedgeMinVersion=150.0-min
browserSize=1920x1280
headless=false
closeBrowserAfterEach=false

# Remote browser hub configuration (Selenide remoteUrl / selenoid:options)
enableVnc=false
enableVideo=false
remoteUrl=

# CM installer (offset ports — dev stack keeps :4444/:8080)
cmHubPort=4445
cmUiPort=8081

# Console log
logToConsole=true
selenideLogToConsole=true
rootLogLevel=info

# Visual baselines (opt-in @Tag(visual); run with -DupdateBaselines=true to refresh)
updateBaselines=false
baselinesDir=screenshots
visualDiffThreshold=0.015
